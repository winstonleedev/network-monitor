<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1>Network Monitor</h1>
          <p class="subtitle">Uptime overview for apple.com</p>
        </div>
        <form id="controls" class="controls">
          <fieldset class="mode-group">
            <legend>Range Mode</legend>
            <label>
              <input type="radio" name="rangeMode" value="preset" checked />
              Preset
            </label>
            <label>
              <input type="radio" name="rangeMode" value="custom" />
              Custom
            </label>
          </fieldset>

          <div class="preset-picker" data-visible="true">
            <label for="presetRange">Preset window</label>
            <select id="presetRange" name="presetRange">
              <option value="1h">Last 1 hour</option>
              <option value="6h" selected>Last 6 hours</option>
              <option value="24h">Last 24 hours</option>
              <option value="7d">Last 7 days</option>
            </select>
          </div>

          <div class="custom-range" data-visible="false">
            <label>
              Start
              <input id="customStart" name="customStart" type="datetime-local" />
            </label>
            <label>
              End
              <input id="customEnd" name="customEnd" type="datetime-local" />
            </label>
          </div>

          <button type="submit">Apply</button>
        </form>
      </header>

      <section class="timeline" id="timeline" aria-live="polite"></section>
      <section class="legend" id="legend"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
